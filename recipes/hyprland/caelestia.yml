# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - copr-celestelove-app2unit.repo
        - copr-celestelove-libcava.repo
        - copr-celestelove-caelestia.repo
        - copr-errornointernet-quickshell.repo
        - copr-brycensranch-gpu-screen-recorder-git.repo
        - copr-deltacopy-darkly.repo
    install:
      packages:
        - libcava-devel
        - app2unit
        - ddcutil
        - brightnessctl
        - lm_sensors
        - fish
        - aubio
        - aubio-devel
        - pipewire-libs
        - qt6-qtdeclarative
        - swappy
        - libqalculate
        - qt6-qtbase
        - caelestia-shell
        - caelestia-cli
        - qtengine
        - papirus-icon-theme
        - darkly-qt6
  - type: script
    scripts:
      - patch_caelestia_gtk_theme.sh
      - install_caelestia_nurture_scheme.sh
