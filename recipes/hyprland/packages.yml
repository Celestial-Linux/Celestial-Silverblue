# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Must run before hardened_malloc is removed below
  - type: script
    scripts:
      - drop_hardened_malloc_preload.sh

  - type: dnf
    repos:
        files:
            - fury-nushell.repo
            - copr-lionheartp-Hyprland.repo
            - copr-lihaohong-yazi.repo
            - copr-atim-starship.repo
            - copr-celestelove-lidm.repo
    remove:
        packages:
            - dunst
            - sway
            - swaylock
            - hardened_malloc
    install:
        packages:
            # Hyprland
            - hyprutils
            - hyprland
            - hyprland-devel
            - xdg-desktop-portal-hyprland
            - xdg-desktop-portal-gtk
            - hyprpaper
            - hyprgraphics
            - hyprlang
            - aquamarine
            - hyprpicker
            - hyprland-qt-support
            - hyprpicker
            - hyprpolkitagent
            - qalculate
            - hyprshot
            - hyprsunset
            - hyprland-guiutils

            # Session manager
            - greetd
            - greetd-selinux
            - gtkgreet
            - cage

            # XWayland
            - wayland-protocols-devel

            # Session launcher
            - uwsm
            - hyprland-uwsm

            # Terminal
            - nushell
            - starship

            # Gnome keyring
            - libsecret
            - gnome-keyring
            - git-credential-libsecret
            - gcr

            # Appearance
            - nwg-look

            # General utilities and file explorer
            - yazi
            - podman-compose
            - mpv
            - swayimg
            - neovim

            # Dependencies for Hyprland plugin manager:
            - cmake
            - meson
            - gcc-c++
            - mesa-libGLES-devel
