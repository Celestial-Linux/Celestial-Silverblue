# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - copr-atim-starship.repo
        - tailscale.repo
    install:
      packages:
        - google-roboto-fonts
        - openssh-askpass
        - file-roller
        - fastfetch
        - gamemode
        - mimalloc
        - glow
        - tailscale
        - starship
        - wcurl
        - ripgrep
        - git-lfs
        - git-delta

        # Development tools
        - clang-devel
        - gdb
        - gtest-devel
        - alsa-lib-devel
        - pipewire-devel
        - libxkbcommon-x11-devel

  # MusicPresence, DeckMaster and Sidra, pinned by SHA-256 in external-rpms.txt
  - type: script
    scripts:
      - install_external_rpms.sh
